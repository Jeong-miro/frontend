<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="" method="get">
      <div>
        <input type="text" name="num1" id="num1" size="5" />
        <select name="op" id="op">
          <option value="+">+</option>
          <option value="-">-</option>
          <option value="*">*</option>
          <option value="/">/</option>
        </select>
        <input type="text" name="num2" id="num2" size="5" />
        <button type="button">계산</button>
      </div>
    </form>
    <div id="result"></div>
    <script>
      // 계산 버튼이 click 되면
      document.querySelector("button").addEventListener("click", () => {
        let num1 = parseInt(document.querySelector("#num1").value);
        let num2 = parseInt(document.querySelector("#num2").value);
        const op = document.querySelector("#op").value;
        // num1 = parseInt("num1");
        // num2 = parseInt("num2");
        // console.log(typeof num1);
        // console.log(typeof num2);
        // string + string => "4" + "5" = "45"
        // Number or praseInt()

        // if ~ else if
        // switch
        let reslut = 0;
        switch (op) {
          case "+":
            result = num1 + num2;
            break;
          case "-":
            result = num1 - num2;
            break;
          case "*":
            result = num1 * num2;
            break;
          case "/":
            result = num1 / num2;
            break;

          default:
            break;
        }

        // result 요소 찾아서 innerText or innerHTML or textContent 속성변경
        document.querySelector("#result").textContent = result;
      });
    </script>
  </body>
</html>
