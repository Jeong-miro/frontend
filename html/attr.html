<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- html attributes -->
    <p>
      <a href="#title1">제목1</a>
    </p>
    <p>
      <a href="#title2">제목2</a>
    </p>
    <p>
      <!-- 절대경로 -->
      <!-- a target - _self(기본) : 현재 |  탭 _blank : 새 탭  -->
      <a href="http://www.naver.com">네이버</a>
    </p>
    <a href="#">네이버2</a>
    <p>
      <!-- 상대경로 -->
      <a href="./basic.html" target="_self">html 기본</a>
    </p>

    <p>
      <!-- src : 이미지 경로, alt : 이미지 안보일때 대체 텍스트 -->
      <img src="./data/peach.jpg" alt="복숭아" />
    </p>
    <h2 id="title1" style="padding-top: 1000px">제목1</h2>
    <h2 id="title2" style="padding-top: 1000px">제목2</h2>
  </body>
</html>
