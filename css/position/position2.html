<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .lastest-news {
        border: 2px solid lightgray;
        width: 350px;
        height: 145px;
        position: relative;
        margin-top: 40px;
      }
      .read-more {
        /* 배경색 검정 */
        background-color: black;
        /* 글자색 흰색 */
        color: white;
        /* 줄높이 30 */
        line-height: 30px;
        /* 안쪽여백 위아래0 좌우10 */
        padding: 0, 10px;
        /* 밑줄 없애기 */
        text-decoration: none;
        position: absolute;
        /* bottom: 150px; */
        bottom: calc(100% + 5px);
        right: 0;
      }
    </style>
  </head>
  <body>
    <div class="lastest-news">
      <ul>
        <li>리스트</li>
        <li>리스트</li>
        <li>리스트</li>
        <li>리스트</li>
        <li>리스트</li>
      </ul>
      <a href="#" class="read-more">Read more</a>
    </div>
  </body>
</html>
