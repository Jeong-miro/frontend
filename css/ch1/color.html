<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      p {
        color: yellow;
        background-color: olive;
        border: 2px dotted rgba(255, 247, 0, 0.7);
      }
      .bg {
        width: 300px;
        height: 300px;
        border: 2px dotted black;
        /* background-image: url(https://placehold.co/100);
        background-repeat: no-repeat;
        background-position: left center; */
        /* background: url(https://placehold.co/100) no-repeat 20% 35%; */
        background: url(https://placehold.co/500x500) no-repeat;
        background-size: contain;
      }
    </style>
  </head>
  <body>
    <!-- 색상 : 
        1) 이름 : red, black ..
        2) rgb : rgb(255,0,144)
        3) rgba : rgba(255,0,144,0.5)
        4) hex : 16진수 
        5) hsl(a) :

        background-image : 크기에 맞춰 반복이 됨
        background-repeat : repeat, repeat-x,repeat-y,no-repeat
        background-position :(퍼센트로 가능) left top; 가로(left,center,right) ,세로(top, center, bottom)
        background-size : contain; 이미지 비례와 상관없이 배경 크기에 맞춰서 자동으로 처리
    -->
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Autem vero et, dolorum nam repudiandae ab obcaecati
      quisquam perferendis exercitationem. Totam quam alias aut ab dolore doloremque architecto, ut optio expedita.
    </p>
    <div>
      <img src="https://placehold.co/100" alt="" />
      <div class="bg"></div>
    </div>
  </body>
</html>
